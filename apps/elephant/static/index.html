<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Elephant</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%98%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/zoo-theme.css"><link rel="stylesheet" href="/style.css"></head><body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="logo">🐘</span><div><b>Elephant</b><div class="sub">limpiador de disco · ZOO</div></div></div>
    <nav id="nav"></nav>
    <div class="grow"></div>
    <div class="mini" id="mini"></div>
    <button class="tool" id="rescan">↻ Reescanear todo</button>
    <div class="hint"><kbd>/</kbd> filtrar · <kbd>Esc</kbd> cerrar</div>
  </aside>
  <main id="main"><div id="view"></div></main>
</div>
<section class="console" id="console" hidden>
  <header><span class="dot" id="cdot"></span><b id="ctitle"></b><span class="grow"></span><button class="btn ghost sm" id="cmin">Minimizar</button><button class="btn ghost sm" id="cclose">Cerrar</button></header>
  <div id="result" class="result" hidden></div>
  <pre id="log"></pre>
</section>
<dialog id="dlg"><form method="dialog"><h3 id="dtitle"></h3><div id="dbody"></div><div class="row-end"><button class="btn ghost" value="no">Cancelar</button><button class="btn p" id="dok" value="yes">Aceptar</button></div></form></dialog>
<div id="toasts"></div>
<script src="/app.js"></script></body></html>
